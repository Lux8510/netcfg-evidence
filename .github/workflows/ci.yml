name: offline-and-browser

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI and assert committed assets are current
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          git diff --exit-code -- web
          test -z "$(git status --porcelain --untracked-files=all -- web)"
      - name: Unit and API tests
        run: python -m pytest
      - name: Drift evaluation
        run: python evals/run_eval.py
      - name: Rule evaluation
        run: python evals/run_rules_eval.py
      - name: Explanation validation evaluation
        run: python evals/run_explain_eval.py
      - name: Publication check
        run: python tools/check_publication.py
      - name: Real concurrency
        run: python -m pytest -m concurrency tests/test_concurrency.py
      - name: Short load check
        run: python -m pytest -m load tests/test_load.py
      - name: Browser end-to-end (skips if Chrome is unavailable)
        run: python -m pytest -m e2e tests/test_e2e_ui.py

  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Lux8510/netsecops-agent
          path: netsecops-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Cross-repo contract (export and import CLIs)
        run: python tools/contract_netsecops.py --netsecops netsecops-agent
      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: contract-report.json
          if-no-files-found: ignore

  contract-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netcfg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Lux8510/netsecops-agent
          path: netsecops-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL contract (migration, coexistence, concurrency, rollback)
        env:
          CONTRACT_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/netcfg
        run: python tools/contract_postgres.py --netsecops netsecops-agent
      - name: Upload PostgreSQL contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-postgres-report
          path: contract-postgres-report.json
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netcfg-evidence:ci .
      - name: Run container and check health
        run: |
          docker run -d --name netcfg -p 8000:8000 \
            -e NETCFG_DATABASE_URL=sqlite:////tmp/netcfg.db \
            -e NETCFG_COOKIE_SECURE=false \
            netcfg-evidence:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          echo "--- UI shell ---"
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'
          echo "ui ok"
          echo "--- metrics without session must be 401 ---"
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/api/metrics
          echo "--- docker healthcheck ---"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' netcfg 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "healthy"; break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' netcfg)" = "healthy"
      - name: Show container logs on failure
        if: failure()
        run: docker logs netcfg || true
      - name: Cleanup
        if: always()
        run: docker rm -f netcfg || true
