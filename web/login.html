<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · netcfg-evidence</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand"><span class="dot"></span><strong>netcfg-evidence</strong></div>
    <p class="muted small">本地账号。编辑者改数据，审批者做决定。</p>
    <form id="login-form" class="stack">
      <label>用户名<input id="username" autocomplete="username" required></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">登录</button>
    </form>
    <p id="login-error" class="status error" role="alert"></p>
    <p class="muted small">首次使用：<code>make user USER=你的名字 ROLE=admin</code></p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
